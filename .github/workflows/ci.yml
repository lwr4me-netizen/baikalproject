name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arbitrpack
          POSTGRES_PASSWORD: arbitrpack
          POSTGRES_DB: arbitrpack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arbitrpack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install system deps (libmagic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit + integration tests (SQLite, in-memory)
        working-directory: apps/api
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Verify Alembic migration against real PostgreSQL
        working-directory: apps/api
        env:
          ARBITRPACK_ENVIRONMENT: development
          ARBITRPACK_DATABASE_URL: postgresql+psycopg://arbitrpack:arbitrpack@localhost:5432/arbitrpack
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage.xml

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build (includes TypeScript type-check)
        working-directory: apps/web
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t arbitrpack-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t arbitrpack-web:ci apps/web

      - name: Smoke test API image
        run: |
          docker run -d --name api-smoke -p 8000:8000 \
            -e ARBITRPACK_ENVIRONMENT=development \
            -e ARBITRPACK_S3_USE_LOCAL_FALLBACK=true \
            -e ARBITRPACK_DATABASE_URL=sqlite:////tmp/ci.db \
            -e ARBITRPACK_PAYMENT_PROVIDER=mock \
            -e ARBITRPACK_ADMIN_TOKEN=ci-smoke-token \
            arbitrpack-api:ci
          sleep 5
          curl -f http://localhost:8000/health

          # Launch-readiness аудит нашёл реальный баг: apps/api/Dockerfile не копировал config/,
          # из-за чего JusticePack (product_code=JUSTICEPACK, правила в config/rules/gas_pravosudie.yaml)
          # отдавал 500 на КАЖДЫЙ запрос в контейнере, при этом ArbitrPack (правила в packages/,
          # которые копировались) работал нормально — и /health, который проверялся здесь раньше,
          # этот класс бага в принципе не мог поймать. Поэтому здесь — реальная загрузка файла
          # через оба product_code, не только health-check.
          echo "dummy smoke-test content" > /tmp/smoke.pdf
          for PRODUCT in ARBITRPACK JUSTICEPACK; do
            echo "Smoke-testing /api/upload for product_code=$PRODUCT"
            STATUS=$(curl -s -o /tmp/smoke_resp_$PRODUCT.json -w "%{http_code}" \
              -F "consent_given=true" -F "ttl_hours=72" -F "product_code=$PRODUCT" \
              -F "files=@/tmp/smoke.pdf;type=application/pdf" \
              http://localhost:8000/api/upload)
            echo "HTTP $STATUS for $PRODUCT"; cat /tmp/smoke_resp_$PRODUCT.json; echo
            if [ "$STATUS" != "200" ]; then
              echo "::error::/api/upload smoke test failed for product_code=$PRODUCT (HTTP $STATUS)"
              docker logs api-smoke
              exit 1
            fi
          done

          docker logs api-smoke
          docker stop api-smoke
