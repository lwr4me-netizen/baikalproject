services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arbitrpack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arbitrpack}
      POSTGRES_DB: ${POSTGRES_DB:-arbitrpack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arbitrpack}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARBITRPACK_ENVIRONMENT: ${ARBITRPACK_ENVIRONMENT:-development}
      ARBITRPACK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arbitrpack}:${POSTGRES_PASSWORD:-arbitrpack}@postgres:5432/${POSTGRES_DB:-arbitrpack}
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ARBITRPACK_ENVIRONMENT: ${ARBITRPACK_ENVIRONMENT:-development}
      ARBITRPACK_SECRET_KEY: ${ARBITRPACK_SECRET_KEY:-dev-insecure-secret-change-me}
      ARBITRPACK_ADMIN_TOKEN: ${ARBITRPACK_ADMIN_TOKEN:-}
      ARBITRPACK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arbitrpack}:${POSTGRES_PASSWORD:-arbitrpack}@postgres:5432/${POSTGRES_DB:-arbitrpack}
      ARBITRPACK_S3_ENDPOINT_URL: http://minio:9000
      ARBITRPACK_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      ARBITRPACK_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ARBITRPACK_S3_BUCKET: arbitrpack-files
      ARBITRPACK_PAYMENT_PROVIDER: ${ARBITRPACK_PAYMENT_PROVIDER:-mock}
      ARBITRPACK_YOOKASSA_SHOP_ID: ${ARBITRPACK_YOOKASSA_SHOP_ID:-}
      ARBITRPACK_YOOKASSA_SECRET_KEY: ${ARBITRPACK_YOOKASSA_SECRET_KEY:-}
      ARBITRPACK_FRONTEND_BASE_URL: ${ARBITRPACK_FRONTEND_BASE_URL:-http://localhost:3000}
      ARBITRPACK_API_BASE_URL: ${ARBITRPACK_API_BASE_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"

  ttl-cleanup:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment:
      ARBITRPACK_ENVIRONMENT: ${ARBITRPACK_ENVIRONMENT:-development}
      ARBITRPACK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arbitrpack}:${POSTGRES_PASSWORD:-arbitrpack}@postgres:5432/${POSTGRES_DB:-arbitrpack}
      ARBITRPACK_S3_ENDPOINT_URL: http://minio:9000
      ARBITRPACK_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      ARBITRPACK_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["sh", "-c", "while true; do python /app/scripts/ttl_cleanup.py; sleep 900; done"]
    profiles: ["with-ttl-daemon"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* переменные Next.js вшивает в клиентский бандл на этапе `next build`,
      # поэтому значение обязательно передавать сюда как build arg, а не только как environment
      # ниже (одного environment достаточно для процесса на рантайме, но не для уже собранного JS).
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  minio_data:
